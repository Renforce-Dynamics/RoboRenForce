[project]
name = "roborenforce"
version = "0.1.0"
description = "RoboRenforce - VLA Training Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RoboRenForce Team" }
]

dependencies = [
    # Core deep learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",

    # Transformers and VLM
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "qwen-vl-utils>=0.0.1",
    "einops>=0.7.0",

    # HuggingFace
    "huggingface-hub>=0.20.0",

    # Image processing
    "pillow>=10.0.0",

    # Video processing (optional, for Phase 1.3+)
    "av>=11.0.0",

    # Logging and monitoring
    "tensorboard>=2.14.0",
    "tqdm>=4.65.0",

    # Configuration
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# LoRA fine-tuning
lora = [
    "peft>=0.8.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

# All optional dependencies
all = [
    "roborenforce[lora,dev]",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["source/RoboRenForce"]
include = ["RoboRenForce*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.uv
  | build
  | dist
  | third_party
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
